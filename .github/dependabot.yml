version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Keep the major versions used by GitHub's current official examples.
    # Minor and patch security/maintenance updates remain enabled.
    ignore:
      - dependency-name: actions/checkout
        update-types:
          - version-update:semver-major
      - dependency-name: actions/setup-python
        update-types:
          - version-update:semver-major
      - dependency-name: actions/dependency-review-action
        update-types:
          - version-update:semver-major
