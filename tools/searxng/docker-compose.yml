# SearXNG for JARVIS — local metasearch, no API key, no query leaving the machine.
#
#   cd C:\JARVIS\tools\searxng
#   docker compose up -d
#
# Bound to 127.0.0.1 deliberately. A SearXNG instance reachable from the network is
# an open proxy that anyone on it can run searches through, attributed to this
# machine's address.
services:
  searxng:
    image: searxng/searxng:latest
    container_name: jarvis-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
